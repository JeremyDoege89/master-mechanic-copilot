# generic-gas-v1: slim fallback pack for non-Ford gasoline vehicles (M3).
# Same hypothesis vocabulary as ford-gen-v1, flatter priors, core OBD tests only.
version: generic-gas-v1

hypotheses:
  vacuum_leak_post_maf: {prior: 0.12, label: {L1: "Air leak after the airflow sensor", L2: "Intake leak downstream of the airflow sensor", L3: "Unmetered air leak post-MAF"}}
  maf_contaminated: {prior: 0.10, label: {L1: "Dirty airflow sensor", L2: "Airflow sensor under-reading from contamination", L3: "MAF sensor contaminated (under-reporting)"}}
  maf_circuit_open: {prior: 0.05, label: {L1: "Airflow sensor unplugged or its wire broken", L2: "Airflow sensor circuit open (unplugged or broken wire)", L3: "MAF circuit open (P0102 class)"}}
  iat_circuit_open: {prior: 0.04, label: {L1: "Temperature sensor wire broken", L2: "Intake-air temperature circuit open", L3: "IAT circuit open (P0113 class)"}}
  fuel_delivery_low: {prior: 0.09, label: {L1: "Engine is not getting fuel", L2: "Low fuel pressure or delivery fault", L3: "Fuel delivery insufficient (pump / fuse / pressure)"}}
  thermostat_stuck_open: {prior: 0.06, label: {L1: "Engine never warms up properly", L2: "Thermostat stuck open (engine runs too cool)", L3: "Thermostat stuck open (P0128 class)"}}
  ignition_misfire_cyl: {prior: 0.09, label: {L1: "One cylinder is misfiring", L2: "Single-cylinder misfire (ignition fault)", L3: "Single-cylinder ignition misfire (P030n class)"}}
  charging_low: {prior: 0.05, label: {L1: "Battery or charging problem", L2: "Charging voltage low (battery or alternator)", L3: "Charging system undervoltage"}}
  o2_slow_b1s1: {prior: 0.05, label: {L1: "Oxygen sensor reacting slowly", L2: "Upstream oxygen sensor slow to react", L3: "Upstream O2 sensor slow/lazy (bank 1 sensor 1)"}}
  healthy: {prior: 0.15, label: {L1: "No fault found", L2: "No fault found (readings look normal)", L3: "No fault (healthy vehicle)"}}
  other: {prior: 0.10, label: {L1: "Something else we have not pinned down", L2: "Different fault not in the suspect list", L3: "Other / unmodeled fault (leak node)"}}

tests:
  dtc_read:
    instructions_by_level: {L1: "Read the fault codes with a scan tool or the app. Write down every code exactly as shown, for example P0303. Do not clear the codes.", L2: "Pull stored, pending and permanent fault codes over the adapter. Record every code exactly as shown and do not clear them, clearing wipes the saved freeze-frame snapshot.", L3: "Dump 03/07/0A codes plus 02 freeze frame. Log raw hex. No Mode 04."}
    kind: obd_read
    min_level: L1
    tools: []
    minutes: 1
    risk: 0
    safety_gate: none
    outcomes: [p0102, p0113, p0128, p030n, none, other_codes]
    evaluator: rule.dtc_match
    likelihoods:
      vacuum_leak_post_maf: {p0102: 0.05, p0113: 0.05, p0128: 0.05, p030n: 0.05, none: 0.70, other_codes: 0.10}
      maf_contaminated: {p0102: 0.10, p0113: 0.05, p0128: 0.05, p030n: 0.05, none: 0.60, other_codes: 0.15}
      maf_circuit_open: {p0102: 0.90, p0113: 0.02, p0128: 0.02, p030n: 0.02, none: 0.02, other_codes: 0.02}
      iat_circuit_open: {p0102: 0.02, p0113: 0.90, p0128: 0.02, p030n: 0.02, none: 0.02, other_codes: 0.02}
      fuel_delivery_low: {p0102: 0.04, p0113: 0.04, p0128: 0.04, p030n: 0.04, none: 0.72, other_codes: 0.12}
      thermostat_stuck_open: {p0102: 0.02, p0113: 0.02, p0128: 0.90, p030n: 0.02, none: 0.02, other_codes: 0.02}
      ignition_misfire_cyl: {p0102: 0.02, p0113: 0.02, p0128: 0.02, p030n: 0.90, none: 0.02, other_codes: 0.02}
      charging_low: {p0102: 0.05, p0113: 0.05, p0128: 0.05, p030n: 0.05, none: 0.60, other_codes: 0.20}
      o2_slow_b1s1: {p0102: 0.05, p0113: 0.05, p0128: 0.05, p030n: 0.05, none: 0.55, other_codes: 0.25}
      healthy: {p0102: 0.03, p0113: 0.03, p0128: 0.03, p030n: 0.03, none: 0.80, other_codes: 0.08}
      other: {p0102: 0.05, p0113: 0.05, p0128: 0.05, p030n: 0.05, none: 0.50, other_codes: 0.30}

  trim_idle_vs_2500:
    instructions_by_level: {L1: "Let the engine idle outside for a minute and note the fuel mixture number. Then hold a steady fast idle exactly as the app instructs and note it again. Extra air leaking in shows at idle and fades at higher speed.", L2: "Log total fuel correction at warm idle, then hold 2500 rpm steady and log again. Lean at idle that returns to normal at speed means unmetered air; lean at both means fuel delivery or airflow sensor.", L3: "Trim split idle vs 2500 rpm steady. Lean at idle only means vacuum leak; lean at both means fuel or airflow sensor."}
    kind: obd_procedure
    min_level: L1
    tools: []
    minutes: 2
    risk: 0
    safety_gate: engine_running_outdoors
    outcomes: [lean_idle_normal_cruise, lean_both, normal, rich]
    evaluator: physics.trim_rpm_split
    likelihoods:
      vacuum_leak_post_maf: {lean_idle_normal_cruise: 0.75, lean_both: 0.15, normal: 0.08, rich: 0.02}
      maf_contaminated: {lean_idle_normal_cruise: 0.15, lean_both: 0.65, normal: 0.15, rich: 0.05}
      maf_circuit_open: {lean_idle_normal_cruise: 0.15, lean_both: 0.60, normal: 0.20, rich: 0.05}
      iat_circuit_open: {lean_idle_normal_cruise: 0.08, lean_both: 0.07, normal: 0.80, rich: 0.05}
      fuel_delivery_low: {lean_idle_normal_cruise: 0.10, lean_both: 0.70, normal: 0.15, rich: 0.05}
      thermostat_stuck_open: {lean_idle_normal_cruise: 0.08, lean_both: 0.07, normal: 0.82, rich: 0.03}
      ignition_misfire_cyl: {lean_idle_normal_cruise: 0.08, lean_both: 0.07, normal: 0.75, rich: 0.10}
      charging_low: {lean_idle_normal_cruise: 0.15, lean_both: 0.15, normal: 0.55, rich: 0.15}
      o2_slow_b1s1: {lean_idle_normal_cruise: 0.15, lean_both: 0.15, normal: 0.50, rich: 0.20}
      healthy: {lean_idle_normal_cruise: 0.05, lean_both: 0.05, normal: 0.85, rich: 0.05}
      other: {lean_idle_normal_cruise: 0.20, lean_both: 0.20, normal: 0.50, rich: 0.10}

  maf_pid_plausibility:
    instructions_by_level: {L1: "With the engine warm and idling outside, look at the airflow reading on the app and compare it with the expected number shown. Near zero or far below expected means the sensor may be dirty or unplugged.", L2: "At warm idle, log airflow in grams per second plus engine speed and pressures. The app computes expected airflow from engine size; under-reading with a lean mixture points to a dirty sensor.", L3: "Warm idle: capture MAF g/s vs physics.maf_expected from engine speed, displacement and pressures. Ratio below 0.7 with lean trims means under-report."}
    kind: obd_calc
    min_level: L1
    tools: []
    minutes: 2
    risk: 0
    safety_gate: engine_running_outdoors
    outcomes: [reads_zero, under_reports, plausible, over_reports]
    evaluator: physics.maf_expected
    likelihoods:
      vacuum_leak_post_maf: {reads_zero: 0.05, under_reports: 0.25, plausible: 0.65, over_reports: 0.05}
      maf_contaminated: {reads_zero: 0.05, under_reports: 0.70, plausible: 0.20, over_reports: 0.05}
      maf_circuit_open: {reads_zero: 0.90, under_reports: 0.04, plausible: 0.04, over_reports: 0.02}
      iat_circuit_open: {reads_zero: 0.05, under_reports: 0.10, plausible: 0.80, over_reports: 0.05}
      fuel_delivery_low: {reads_zero: 0.60, under_reports: 0.10, plausible: 0.20, over_reports: 0.10}
      thermostat_stuck_open: {reads_zero: 0.05, under_reports: 0.10, plausible: 0.80, over_reports: 0.05}
      ignition_misfire_cyl: {reads_zero: 0.05, under_reports: 0.10, plausible: 0.80, over_reports: 0.05}
      charging_low: {reads_zero: 0.05, under_reports: 0.23, plausible: 0.55, over_reports: 0.17}
      o2_slow_b1s1: {reads_zero: 0.05, under_reports: 0.23, plausible: 0.55, over_reports: 0.17}
      healthy: {reads_zero: 0.02, under_reports: 0.08, plausible: 0.85, over_reports: 0.05}
      other: {reads_zero: 0.15, under_reports: 0.20, plausible: 0.50, over_reports: 0.15}

  visual_intake_boot:
    instructions_by_level: {L1: "With the engine OFF and cool, open the hood and look closely at the big rubber tube between the air filter box and the engine. Feel along it for cracks, splits or loose clamps, and photograph anything odd.", L2: "Engine off and cool: inspect the intake boot and vacuum hoses past the airflow sensor for cracks, splits and loose clamps. Photograph any damage for the log.", L3: "Engine off: inspect intake tract past the airflow sensor plus vacuum lines. Photograph defects."}
    kind: visual
    min_level: L1
    tools: []
    minutes: 3
    risk: 0
    safety_gate: engine_off
    outcomes: [cracked_disconnected, looks_ok, inconclusive]
    evaluator: visual.direct
    likelihoods:
      vacuum_leak_post_maf: {cracked_disconnected: 0.65, looks_ok: 0.25, inconclusive: 0.10}
      maf_contaminated: {cracked_disconnected: 0.05, looks_ok: 0.80, inconclusive: 0.15}
      maf_circuit_open: {cracked_disconnected: 0.05, looks_ok: 0.80, inconclusive: 0.15}
      iat_circuit_open: {cracked_disconnected: 0.05, looks_ok: 0.80, inconclusive: 0.15}
      fuel_delivery_low: {cracked_disconnected: 0.05, looks_ok: 0.80, inconclusive: 0.15}
      thermostat_stuck_open: {cracked_disconnected: 0.05, looks_ok: 0.80, inconclusive: 0.15}
      ignition_misfire_cyl: {cracked_disconnected: 0.05, looks_ok: 0.80, inconclusive: 0.15}
      charging_low: {cracked_disconnected: 0.05, looks_ok: 0.80, inconclusive: 0.15}
      o2_slow_b1s1: {cracked_disconnected: 0.05, looks_ok: 0.80, inconclusive: 0.15}
      healthy: {cracked_disconnected: 0.05, looks_ok: 0.85, inconclusive: 0.10}
      other: {cracked_disconnected: 0.10, looks_ok: 0.60, inconclusive: 0.30}

  listen_fuel_pump_prime:
    instructions_by_level: {L1: "Turn the key to ON without starting the engine and listen near the back seat for a short humming sound lasting a couple of seconds. That hum is the fuel pump. Note whether you hear it or not.", L2: "Key on, engine off: listen at the fuel filler for the 2-second pump prime. No prime plus a no-start points at fuel delivery.", L3: "Key on, engine off: confirm the 2-second pump prime is audible. No prime means fuel circuit fault."}
    kind: sensory
    min_level: L1
    tools: []
    minutes: 1
    risk: 0
    safety_gate: none
    outcomes: [no_prime_no_start, primes_normally, weak_prime]
    evaluator: sensory.direct
    likelihoods:
      vacuum_leak_post_maf: {no_prime_no_start: 0.05, primes_normally: 0.80, weak_prime: 0.15}
      maf_contaminated: {no_prime_no_start: 0.05, primes_normally: 0.80, weak_prime: 0.15}
      maf_circuit_open: {no_prime_no_start: 0.05, primes_normally: 0.80, weak_prime: 0.15}
      iat_circuit_open: {no_prime_no_start: 0.05, primes_normally: 0.80, weak_prime: 0.15}
      fuel_delivery_low: {no_prime_no_start: 0.85, primes_normally: 0.10, weak_prime: 0.05}
      thermostat_stuck_open: {no_prime_no_start: 0.05, primes_normally: 0.80, weak_prime: 0.15}
      ignition_misfire_cyl: {no_prime_no_start: 0.05, primes_normally: 0.80, weak_prime: 0.15}
      charging_low: {no_prime_no_start: 0.05, primes_normally: 0.75, weak_prime: 0.20}
      o2_slow_b1s1: {no_prime_no_start: 0.05, primes_normally: 0.75, weak_prime: 0.20}
      healthy: {no_prime_no_start: 0.02, primes_normally: 0.90, weak_prime: 0.08}
      other: {no_prime_no_start: 0.10, primes_normally: 0.70, weak_prime: 0.20}

  ect_warmup_curve:
    instructions_by_level: {L1: "Start the cold engine outside and let it idle. Watch the temperature gauge on the app for about 15 minutes. If it levels off well below normal, the part that helps the engine warm up may be stuck open.", L2: "From a cold start, log coolant temperature out to its plateau, about 15 minutes of idle. A plateau stuck near 70 degrees with a P0128 code means the thermostat is stuck open.", L3: "Cold-start coolant curve to plateau. A low plateau near 70 degrees means stuck-open thermostat."}
    kind: obd_procedure
    min_level: L1
    tools: []
    minutes: 15
    risk: 0
    safety_gate: engine_running_outdoors
    outcomes: [plateau_low, plateau_normal, inconclusive]
    evaluator: physics.ect_plateau
    likelihoods:
      vacuum_leak_post_maf: {plateau_low: 0.05, plateau_normal: 0.85, inconclusive: 0.10}
      maf_contaminated: {plateau_low: 0.05, plateau_normal: 0.85, inconclusive: 0.10}
      maf_circuit_open: {plateau_low: 0.05, plateau_normal: 0.85, inconclusive: 0.10}
      iat_circuit_open: {plateau_low: 0.05, plateau_normal: 0.85, inconclusive: 0.10}
      fuel_delivery_low: {plateau_low: 0.05, plateau_normal: 0.85, inconclusive: 0.10}
      thermostat_stuck_open: {plateau_low: 0.85, plateau_normal: 0.10, inconclusive: 0.05}
      ignition_misfire_cyl: {plateau_low: 0.05, plateau_normal: 0.85, inconclusive: 0.10}
      charging_low: {plateau_low: 0.05, plateau_normal: 0.85, inconclusive: 0.10}
      o2_slow_b1s1: {plateau_low: 0.05, plateau_normal: 0.85, inconclusive: 0.10}
      healthy: {plateau_low: 0.02, plateau_normal: 0.88, inconclusive: 0.10}
      other: {plateau_low: 0.10, plateau_normal: 0.60, inconclusive: 0.30}

  mode06_misfire_counts:
    instructions_by_level: {L1: "This is a deeper check for a confident DIYer. The app reads the car's own misfire counters for each cylinder. A counter that keeps climbing points to the misfiring cylinder.", L2: "Read the on-board misfire counts per cylinder. Any cylinder at or above the threshold over the window counts as a misfiring cylinder.", L3: "Per-cylinder misfire counts vs threshold window."}
    kind: obd_read
    min_level: L2
    tools: []
    minutes: 2
    risk: 0
    safety_gate: engine_running_outdoors
    outcomes: [misfire_cyl_n, no_misfire, inconclusive]
    evaluator: mode06.misfire
    likelihoods:
      vacuum_leak_post_maf: {misfire_cyl_n: 0.05, no_misfire: 0.85, inconclusive: 0.10}
      maf_contaminated: {misfire_cyl_n: 0.05, no_misfire: 0.85, inconclusive: 0.10}
      maf_circuit_open: {misfire_cyl_n: 0.05, no_misfire: 0.85, inconclusive: 0.10}
      iat_circuit_open: {misfire_cyl_n: 0.05, no_misfire: 0.85, inconclusive: 0.10}
      fuel_delivery_low: {misfire_cyl_n: 0.05, no_misfire: 0.85, inconclusive: 0.10}
      thermostat_stuck_open: {misfire_cyl_n: 0.05, no_misfire: 0.85, inconclusive: 0.10}
      ignition_misfire_cyl: {misfire_cyl_n: 0.90, no_misfire: 0.05, inconclusive: 0.05}
      charging_low: {misfire_cyl_n: 0.05, no_misfire: 0.85, inconclusive: 0.10}
      o2_slow_b1s1: {misfire_cyl_n: 0.05, no_misfire: 0.85, inconclusive: 0.10}
      healthy: {misfire_cyl_n: 0.02, no_misfire: 0.90, inconclusive: 0.08}
      other: {misfire_cyl_n: 0.10, no_misfire: 0.70, inconclusive: 0.20}

  battery_voltage_rest_running:
    instructions_by_level: {L1: "You need a multimeter for this one. With the engine OFF, touch the red lead to the battery plus terminal and the black lead to minus, and read the volts. Then start the engine and read again. The app shows the healthy ranges.", L2: "Multimeter across the battery terminals: rest voltage with the engine off, then running voltage. Rest below 12.4 or running outside 13.5 to 14.8 means a charging fault.", L3: "Meter: rest volts engine off plus running volts. Judge against physics.voltage bands."}
    kind: measurement
    min_level: L2
    tools: [multimeter]
    minutes: 5
    risk: 0
    safety_gate: none
    outcomes: [low_rest, low_running, normal, overcharging]
    evaluator: physics.voltage
    likelihoods:
      vacuum_leak_post_maf: {low_rest: 0.05, low_running: 0.05, normal: 0.85, overcharging: 0.05}
      maf_contaminated: {low_rest: 0.05, low_running: 0.05, normal: 0.85, overcharging: 0.05}
      maf_circuit_open: {low_rest: 0.05, low_running: 0.05, normal: 0.85, overcharging: 0.05}
      iat_circuit_open: {low_rest: 0.05, low_running: 0.05, normal: 0.85, overcharging: 0.05}
      fuel_delivery_low: {low_rest: 0.05, low_running: 0.05, normal: 0.85, overcharging: 0.05}
      thermostat_stuck_open: {low_rest: 0.05, low_running: 0.05, normal: 0.85, overcharging: 0.05}
      ignition_misfire_cyl: {low_rest: 0.05, low_running: 0.05, normal: 0.85, overcharging: 0.05}
      charging_low: {low_rest: 0.25, low_running: 0.55, normal: 0.15, overcharging: 0.05}
      o2_slow_b1s1: {low_rest: 0.05, low_running: 0.05, normal: 0.85, overcharging: 0.05}
      healthy: {low_rest: 0.03, low_running: 0.03, normal: 0.90, overcharging: 0.04}
      other: {low_rest: 0.15, low_running: 0.15, normal: 0.60, overcharging: 0.10}

  engine_sound_screen:
    instructions_by_level: {L1: "Park outside with the brake on. Record a short sound clip of the running engine as the app shows. The app measures the sound pattern: a whistle that fades when revved hints at an air leak, a repeating stumble hints at a misfire.", L2: "Outdoors, brake set: record 5 to 8 seconds of engine sound at idle through the app, plus live engine speed and cylinder count. The sound check screens for misfire stumble, belt whistle and air-leak hiss.", L3: "44.1 kHz idle clip plus 2500 clip if hiss suspected, with live speed and cylinder count. Screened by dsp.engine_sound."}
    kind: sensory
    min_level: L1
    tools: []
    minutes: 3
    risk: 0
    safety_gate: engine_running_outdoors
    outcomes: [misfire_dropout, belt_bearing_tone, vacuum_hiss, normal, inconclusive]
    evaluator: dsp.engine_sound
    likelihoods:
      vacuum_leak_post_maf: {misfire_dropout: 0.05, belt_bearing_tone: 0.05, vacuum_hiss: 0.65, normal: 0.20, inconclusive: 0.05}
      maf_contaminated: {misfire_dropout: 0.05, belt_bearing_tone: 0.05, vacuum_hiss: 0.10, normal: 0.70, inconclusive: 0.10}
      maf_circuit_open: {misfire_dropout: 0.05, belt_bearing_tone: 0.05, vacuum_hiss: 0.10, normal: 0.70, inconclusive: 0.10}
      iat_circuit_open: {misfire_dropout: 0.05, belt_bearing_tone: 0.05, vacuum_hiss: 0.05, normal: 0.75, inconclusive: 0.10}
      fuel_delivery_low: {misfire_dropout: 0.15, belt_bearing_tone: 0.05, vacuum_hiss: 0.05, normal: 0.60, inconclusive: 0.15}
      thermostat_stuck_open: {misfire_dropout: 0.03, belt_bearing_tone: 0.05, vacuum_hiss: 0.02, normal: 0.75, inconclusive: 0.15}
      ignition_misfire_cyl: {misfire_dropout: 0.75, belt_bearing_tone: 0.03, vacuum_hiss: 0.02, normal: 0.10, inconclusive: 0.10}
      charging_low: {misfire_dropout: 0.05, belt_bearing_tone: 0.40, vacuum_hiss: 0.05, normal: 0.40, inconclusive: 0.10}
      o2_slow_b1s1: {misfire_dropout: 0.08, belt_bearing_tone: 0.05, vacuum_hiss: 0.07, normal: 0.70, inconclusive: 0.10}
      healthy: {misfire_dropout: 0.03, belt_bearing_tone: 0.05, vacuum_hiss: 0.07, normal: 0.75, inconclusive: 0.10}
      other: {misfire_dropout: 0.15, belt_bearing_tone: 0.15, vacuum_hiss: 0.15, normal: 0.40, inconclusive: 0.15}

dependency_groups: [[stft_b1, ltft_b1]]
