[project]
name = "mmc"
version = "0.1.0"
description = "Master Mechanic Copilot backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6",
  "jsonschema>=4",
  "referencing>=0.30",
  "python-multipart>=0.0.18",
  "openai>=1.0",  # Meta Model API via OpenAI SDK (AGENTS.md Meta client rules)
  "meta-sam-parser>=0.1.0",
]
readme = "README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "httpx>=0.27",
  "wsproto>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
