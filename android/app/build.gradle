plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'dev.dreamz.mmc'
    compileSdk 35
    buildToolsVersion '35.0.0'

    def mmcBackendUrl = findProperty("MMC_BACKEND_URL") ?: "http://100.64.0.1:8000"
    defaultConfig {
        applicationId 'dev.dreamz.mmc'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        // Debug default: backend over Tailscale; editable on-device in Settings.
        // A string resource, not a BuildConfig constant: constants get inlined into callers
        // and a cached compile can keep an old URL.
        resValue "string", "default_backend_url", mmcBackendUrl
    }

    buildTypes {
        debug {
            // Dev backend is plain http over Tailscale.
            manifestPlaceholders = [usesCleartext: "true"]
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [usesCleartext: "false"]
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
}
