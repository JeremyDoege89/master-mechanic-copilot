plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'dev.dreamz.mmc'
    compileSdk 35
    buildToolsVersion '35.0.0'

    def mmcBackendUrl = findProperty("MMC_BACKEND_URL") ?: "http://100.64.0.1:8000"
    defaultConfig {
        applicationId 'dev.dreamz.mmc'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        // Debug default: backend over Tailscale; editable on-device in Settings.
        // A string resource, not a BuildConfig constant: constants get inlined into callers
        // and a cached compile can keep an old URL.
        resValue "string", "default_backend_url", mmcBackendUrl
    }

    // Owner signing (M7 §4): the keystore lives OUTSIDE the repo and is
    // created by the owner (docs/RELEASE.md). Nothing key-related is
    // committed: passwords come from env / gitignored local.properties.
    signingConfigs {
        release {
            def ksPath = System.getenv("MMC_KEYSTORE_PATH")
            def ksAlias = System.getenv("MMC_KEYSTORE_ALIAS")
            if (ksPath != null && ksAlias != null) {
                storeFile file(ksPath)
                storePassword System.getenv("MMC_KEYSTORE_PASSWORD")
                keyAlias ksAlias
                keyPassword System.getenv("MMC_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // Dev backend is plain http over Tailscale.
            manifestPlaceholders = [usesCleartext: "true"]
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [usesCleartext: "false"]
            // Signed only when the owner exported the keystore env (the
            // release script refuses otherwise); unsigned otherwise.
            if (System.getenv("MMC_KEYSTORE_PATH") != null &&
                System.getenv("MMC_KEYSTORE_ALIAS") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // M5 live camera (CameraX 1.4.2: 1.5+ needs AGP 8.9 and compileSdk 36).
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-video:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    testImplementation 'junit:junit:4.13.2'
}
